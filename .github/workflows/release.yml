name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag against the version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'myuri').version
          if ("v$version" -cne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/release/myuri.exe, README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath Myuri-windows-x64.zip
      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          path: Myuri-windows-x64.zip
          archive: false
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Myuri-windows-x64.zip
          skip-decompress: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum Myuri-windows-x64.zip > Myuri-windows-x64.zip.sha256
          gh release create "$GITHUB_REF_NAME" Myuri-windows-x64.zip Myuri-windows-x64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Myuri $GITHUB_REF_NAME" --generate-notes
