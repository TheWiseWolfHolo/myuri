name: Release

# Push a tag like v0.1.0 to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag against the version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/release/myuri.exe, README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath Myuri-windows-x64.zip
          $hash = (Get-FileHash Myuri-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Myuri-windows-x64.zip" | Out-File -Encoding ascii Myuri-windows-x64.zip.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME Myuri-windows-x64.zip Myuri-windows-x64.zip.sha256 --title "Myuri $env:GITHUB_REF_NAME" --generate-notes
